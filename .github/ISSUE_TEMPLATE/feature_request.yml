name: Feature request
description: Suggest an improvement to Couch Remote
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the current friction and who it affects.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or extra context
  - type: checkboxes
    id: review
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for a similar request.
          required: true
