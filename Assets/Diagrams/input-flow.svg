  <rect x="918" y="210" width="236" height="108" rx="24" fill="#171C30" stroke="#FF9B8D" stroke-opacity=".52"/>
  <circle cx="970" cy="264" r="25" stroke="#EAEAF4" stroke-opacity=".68" stroke-width="4"/><circle cx="970" cy="264" r="7" fill="#FF9B8D"/>
  <path d="M1012 248h111M1012 266h75M1012 284h92" stroke="#8B93AE" stroke-width="4" stroke-linecap="round"/>
  <text x="1182" y="258" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="20" font-weight="650">Trackpad</text><text x="1182" y="284" fill="#929AB2" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="14">point · click · drag</text>
  <!-- Remote -->
  <rect x="918" y="366" width="236" height="108" rx="24" fill="#171C30" stroke="#F06B86" stroke-opacity=".52"/>
  <path d="M970 389v62M939 420h62M961 396l9-9 9 9M961 444l9 9 9-9M946 411l-9 9 9 9M994 411l9 9-9 9" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1030" y="412" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="20" font-weight="650">Remote</text><text x="1030" y="438" fill="#929AB2" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="14">swipe · navigate · select</text>
  <!-- Scroll -->
  <rect x="1210" y="288" width="318" height="108" rx="24" fill="#171C30" stroke="#9A7DFF" stroke-opacity=".52"/>
